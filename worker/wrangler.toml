name = "writingbank-module-worker"
main = "src/index.ts"
compatibility_date = "2024-11-11"
compatibility_flags = ["nodejs_compat"]

[vars]
# Local defaults. Production overrides: AUTH_MODE="firebase", DIRECTORY_MODE="google".
AUTH_MODE = "dev"
FIREBASE_PROJECT_ID = "hyperdatalab-writing-bank"
ORG_DOMAIN = "hyperdatalab.org"
ADMIN_EMAIL = "admin@hyperdatalab.org"
DIRECTORY_MODE = "mock"
CORS_ORIGIN = "http://localhost:5174"
MAX_DOWNLOAD_BYTES = "26214400"

[[d1_databases]]
binding = "DB"
database_name = "wb_module"
database_id = "00000000-0000-0000-0000-000000000000" # replace after `wrangler d1 create wb_module`
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "wb-module-files"

[triggers]
crons = ["0 19 * * *"] # 02:00 Asia/Ho_Chi_Minh, directory sync
