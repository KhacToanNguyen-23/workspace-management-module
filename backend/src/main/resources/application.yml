server:
  port: 8080

spring:
  application:
    name: wb-module
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      enabled: false

app:
  firestore:
    project-id: ${FIRESTORE_PROJECT_ID:hyperdatalab-writing-bank}
    emulator-host: ${FIRESTORE_EMULATOR_HOST:}
    credentials-file: ${GOOGLE_APPLICATION_CREDENTIALS:}
  org-domain: hyperdatalab.org
  # Seeds demo accounts/workspace at startup. Only has an effect when auth.mode is dev.
  dev-seed: ${DEV_SEED:true}
  # The first admin; must be a real account in the user directory.
  admin-email: ${ADMIN_EMAIL:admin@hyperdatalab.org}
  auth:
    # sso (production: HyperDataLab SSO) | firebase | dev (local only: Bearer dev:<email>)
    mode: ${AUTH_MODE:dev}
    sso:
      # The ResearchPulse Worker that serves /oauth/authorize, /oauth/token and /oauth/userinfo.
      base-url: ${SSO_BASE_URL:}
      client-id: ${SSO_CLIENT_ID:}
      # Empty for a Public client; set it for a Confidential one.
      client-secret: ${SSO_CLIENT_SECRET:}
      session-hours: ${SSO_SESSION_HOURS:12}
      # Base64 of 32 random bytes: encrypts the SSO tokens kept to read projects. Every backend
      # instance needs the same one. Empty = a random key per start (fine locally).
      token-key: ${SSO_TOKEN_KEY:}
  projects:
    # auto (http with the SSO, demo otherwise) | http | demo | off
    mode: ${PROJECTS_MODE:auto}
    # Empty = the SSO base URL.
    base-url: ${PROJECTS_BASE_URL:}
    firebase-project-id: ${FIREBASE_PROJECT_ID:hyperdatalab-writing-bank}
  directory:
    # http (external user API) | google (Admin SDK) | mock | off
    mode: ${DIRECTORY_MODE:mock}
    http-base-url: ${DIRECTORY_HTTP_BASE_URL:}
    http-token: ${DIRECTORY_HTTP_TOKEN:}
    google-service-account-file: ${GOOGLE_SA_FILE:}
    cache-hours: 12
  cors-origins:
    - ${CORS_ORIGIN:http://localhost:3000}
